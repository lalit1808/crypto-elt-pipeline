name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-postgres==1.11.0

      - name: Check dbt project parses correctly
        working-directory: dbt_project
        run: dbt parse --profiles-dir . --no-partial-parse
        env:
          WAREHOUSE_DB_HOST: localhost
          WAREHOUSE_DB_USER: warehouse
          WAREHOUSE_DB_PASSWORD: warehouse
          WAREHOUSE_DB_NAME: warehouse_db
