version: 2

models:
  - name: fact_daily_ohlc
    description: >
      One row per coin per fully completed day. Open = earliest snapshot
      of the day, close = latest snapshot of the day, high/low = extremes
      across all snapshots, avg = mean across all snapshots. Only
      processes days before today.
    columns:
      - name: coin_id
        description: CoinGecko coin identifier.
        tests:
          - not_null
      - name: price_date
        description: The completed calendar day this row summarizes.
        tests:
          - not_null
      - name: open_price_eur
        description: Price at the earliest snapshot of the day.
      - name: close_price_eur
        description: Price at the latest snapshot of the day.
      - name: high_price_eur
        description: Highest price seen across all of the day's snapshots.
      - name: low_price_eur
        description: Lowest price seen across all of the day's snapshots.
      - name: avg_price_eur
        description: Mean price across all of the day's snapshots.
      - name: movement_pct_of_the_day
        description: >
          Percentage change from open to close for the day.

  - name: fact_price_history
    description: >
      Daily price history (one row per coin per day), combining the
      legacy seed, finalized daily OHLC summaries, and a live average
      for today. Incremental: only the last 2 days are reprocessed on
      each run, older history stays untouched.
    columns:
      - name: coin_id
        description: CoinGecko coin identifier.
        tests:
          - not_null
      - name: price_date
        description: Calendar date this row represents.
        tests:
          - not_null
      - name: avg_price_eur
        description: Average price in EUR for this coin on this date.
        tests:
          - not_null
      - name: market_cap_eur
        description: Average market capitalization in EUR for this date.
      - name: volume_eur
        description: Average 24h trading volume in EUR for this date.

  - name: mart_daily_top_movers
    description: >
      Daily gainers and losers, ranked independently within each
      completed day.
    columns:
      - name: coin_id
        description: CoinGecko coin identifier.
        tests:
          - not_null
      - name: price_date
        description: The completed day this ranking applies to.
        tests:
          - not_null
      - name: pct_change
        description: Open-to-close percentage change for this coin on this day.
        tests:
          - not_null
      - name: gainer_rank
        description: Rank 1 = biggest gainer that day.
        tests:
          - not_null
      - name: loser_rank
        description: Rank 1 = biggest loser that day.
        tests:
          - not_null

  - name: mart_hourly_top_movers
    description: >
      Live, short-term gainers and losers for today, comparing each
      coin's most recent snapshot to the one immediately before it.
    columns:
      - name: coin_id
        description: CoinGecko coin identifier.
        tests:
          - not_null
      - name: pct_change
        description: Percentage change between the last two hourly snapshots.
        tests:
          - not_null
      - name: gainer_rank
        description: Rank 1 = biggest gainer in the most recent hour.
        tests:
          - not_null
      - name: loser_rank
        description: Rank 1 = biggest loser in the most recent hour.
        tests:
          - not_null

  - name: dim_tracked_coins
    description: >
      Coins present in the most recent snapshot - currently in the
      tracked top 25 by market cap, right now.
    columns:
      - name: coin_id
        description: CoinGecko coin identifier.
        tests:
          - not_null
          - unique